name: ragatool

services:
  backend:
    image: ghcr.io/rykhalskyi/ragatool-backend:latest
    ports:
      - "4301:8000"
      - "4302:8001"
      - "4303:8002"
    env_file:
      - backend/.env
    environment:
      PYTHONUNBUFFERED: 1
      ALLOWED_ORIGINS: http://localhost:4300
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"

  frontend:
    image: ghcr.io/rykhalskyi/ragatool-frontend:latest
    environment:
      API_URL: /api
      BACKEND_URL: http://backend:8000
    ports:
      - "4300:80"
    depends_on:
      - backend
