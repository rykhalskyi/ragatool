@if (!isAuthPage()) {
  <app-topbar></app-topbar>
}
<main class="content" [class.auth-layout]="isAuthPage()">
  <div class="main-container">
    @if (!isAuthPage()) {
      <app-collections-list class="topic-list"></app-collections-list>
      <div class="vertical-divider" (mousedown)="startDragging($event)"></div>
    }
    <div class="selected-topic">
      <router-outlet></router-outlet>
    </div>
    @if (!isAuthPage() && agentUi.visible()) {
      <div class="agent-divider" (mousedown)="startAgentResizing($event)"
           [attr.data-testid]="TestIds.agentResizeHandle"></div>
      <app-agent-pane></app-agent-pane>
    }
  </div>
</main>
