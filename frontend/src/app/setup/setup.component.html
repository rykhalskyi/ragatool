<div class="auth-page">
  <mat-card class="auth-card">
    <img
      class="mascot"
      src="assets/login-mouse.png"
      alt="Ragatool mouse mascot"
    />

    <h1>Create your account</h1>
    <p class="subtitle">
      This is the first run. Use the setup code printed in the backend logs.
    </p>

    <form (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Setup code</mat-label>
        <input
          matInput
          autocomplete="one-time-code"
          name="setupCode"
          [(ngModel)]="setupCode"
          [attr.data-testid]="TestIds.setupCodeInput"
          required
        />
        <mat-icon matPrefix>key</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input
          matInput
          autocomplete="username"
          name="username"
          [(ngModel)]="username"
          [attr.data-testid]="TestIds.setupUsernameInput"
          required
        />
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          autocomplete="new-password"
          name="password"
          [(ngModel)]="password"
          [attr.data-testid]="TestIds.setupPasswordInput"
          required
        />
        <mat-icon matPrefix>lock</mat-icon>
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
        >
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirm password</mat-label>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          autocomplete="new-password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          [attr.data-testid]="TestIds.setupConfirmPasswordInput"
          required
        />
        <mat-icon matPrefix>lock</mat-icon>
      </mat-form-field>

      @if (error) {
        <p class="error" role="alert">{{ error }}</p>
      }

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="submit-button"
        [disabled]="loading"
        [attr.data-testid]="TestIds.setupSubmitButton"
      >
        {{ loading ? 'Creating…' : 'Create account' }}
      </button>
    </form>
  </mat-card>
</div>
